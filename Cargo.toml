[package]
name = "cli-util"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Utilities for Rust CLI apps"
homepage = "https://github.com/DenisGorbachev/cli-util"
repository = "https://github.com/DenisGorbachev/cli-util"
readme = "README.md"
keywords = []
categories = []
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "README.ts",
    "AGENTS*.md",
    "CLAUDE*.md",
    "deno.lock",
    "deno.json",
    "commitlint.config.mjs",
    "fnox.toml",
    "lefthook.yml",
    "mise.toml",
    "rumdl.toml",
    "rustfmt.toml",
    ".yolobox"
]

[package.metadata.details]
tagline = ""
summary = ""
announcement = ""
readme = {}

[dependencies]

[dev-dependencies]
tokio = { version = "1.44.1", features = ["rt", "macros"] }

[package.metadata.cargo-machete]
ignored = ["derive_more", "derive-getters", "derive-new", "fmt-derive", "stub-macro", "standard-traits", "helpful", "subtype"]
